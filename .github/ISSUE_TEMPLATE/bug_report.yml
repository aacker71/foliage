name: Bug report
description: Something does not work as the README or docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste private repository contents, emails, tokens or anything from your `~/.foliage` garden. For security problems use the private report link in SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, starting from a clone.
      render: bash
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "Output of `node --version`, `pnpm --version`, and your OS (for example macOS 15 arm64)."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The failing line, verbatim. Not the whole log.
      render: text
